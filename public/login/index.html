<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />


    <style>
       * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    body::after {
        content: "© 2026 Empresa XYZ — v2.0-enterprise";
        position: fixed;
        bottom: 6px;
        right: 10px;
        font-size: 0.68rem;
        color: #475569;
        pointer-events: none;
        user-select: none;
    }

    .login-container {
        background: #1e293b;
        border-radius: 16px;
        padding: 40px 36px;
        width: 100%;
        max-width: 420px;
        border-top: 4px solid #38bdf8;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
        from { transform: translateY(-12px); opacity: 0; }
        to   { transform: translateY(0);     opacity: 1; }
    }

    .login-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .login-header i {
        font-size: 2rem;
        color: #38bdf8;
        background: #0f172a;
        width: 62px;
        height: 62px;
        line-height: 62px;
        border-radius: 50%;
        margin-bottom: 14px;
        border: 1px solid #334155;
    }

    .login-header h1 {
        font-size: 1.5rem;
        margin-bottom: 6px;
    }

    .login-header p {
        color: #94a3b8;
        font-size: 0.88rem;
    }

    .message {
        display: none;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 0.84rem;
        margin-bottom: 18px;
        border-left: 4px solid #ef4444;
        background: #7f1d1d;
        color: #fca5a5;
    }

    .message.show { display: block; }
    .message.success {
        border-color: #10b981;
        background: #064e3b;
        color: #6ee7b7;
    }

    .input-group {
        position: relative;
        margin-bottom: 16px;
    }

    .input-group input {
        width: 100%;
        padding: 13px 14px 13px 42px;
        background: #0f172a;
        border: 1px solid #334155;
        color: #e2e8f0;
        border-radius: 8px;
        font-size: 0.92rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input::placeholder { color: #64748b; }

    .input-group input:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .input-group i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #64748b;
        font-size: 0.9rem;
        pointer-events: none;
    }

    .login-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 22px;
        font-size: 0.82rem;
    }

    .login-options label {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #94a3b8;
        cursor: pointer;
    }

    .login-options input[type="checkbox"] {
        accent-color: #38bdf8;
        cursor: pointer;
    }

    .login-options a {
        color: #38bdf8;
        text-decoration: none;
        transition: color 0.2s;
    }

    .login-options a:hover { color: #7dd3fc; }

    .btn-login {
        width: 100%;
        padding: 12px;
        background: #38bdf8;
        color: #0f172a;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        transition: background 0.2s, transform 0.1s;
    }

    .btn-login:hover:not(:disabled) { background: #7dd3fc; }
    .btn-login:active:not(:disabled) { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .signup-link {
        text-align: center;
        margin-top: 22px;
        font-size: 0.84rem;
        color: #94a3b8;
        padding-top: 18px;
        border-top: 1px solid #334155;
    }

    .signup-link a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: 600;
    }

    .signup-link a:hover { color: #7dd3fc; }

    /* Toast */
    .toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #1e293b;
        border-left: 4px solid #10b981;
        padding: 14px 20px;
        border-radius: 10px;
        color: #e2e8f0;
        font-size: 0.88rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transform: translateX(400px);
        transition: transform 0.3s;
        z-index: 200;
    }

    .toast.show { transform: translateX(0); }
    .toast.error { border-color: #ef4444; }

    @media (max-width: 480px) {
        .login-container { padding: 30px 22px; }
    }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-lock"></i>
            <h1>Bem-vindo</h1>
            <p>Faça login para continuar</p>
        </div>

        <!-- Mensagem de feedback -->
        <div id="message" class="message"></div>

        <form action="/user" method="POST" id="login-Form" novalidate>
            <div class="input-group">
                <input type="nome" id="name" placeholder="Seu nome" required />
                <i class="fas fa-user"></i>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Sua senha" required />
                <i class="fas fa-key"></i>
            </div>

            <div class="login-options">
                <label>
                    <input type="checkbox" checked /> Lembrar-me
                </label>
                <a href="#">Esqueci a senha</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>

        <div class="signup-link">
            Não tem uma conta? <a href="../cadastro/index.html" id="registerLink">Cadastre-se</a>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
